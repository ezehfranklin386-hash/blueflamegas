<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Blue Flame</title>
    <style>
        /* Design System Variables */
        :root {
            --primary-color: #005f73;
            --secondary-color: #0a9396;
            --accent-color: #94d2bd;
            --background-color: #e9d8a6;
            --text-color: #001219;
            --font-family: 'Arial', sans-serif;
            --transition-speed: 0.3s;
        }

        /* Utility classes */
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 1rem;
        }
        .mb-1 {
            margin-bottom: 1rem;
        }
        .p-1 {
            padding: 1rem;
        }

        /* Enhanced Animations */
        .fade-in {
            animation: fadeIn var(--transition-speed);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Accessibility Support */
        .high-contrast {
            color: var(--primary-color);
            background-color: var(--accent-color);
        }

        /* Professional Organization */
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color var(--transition-speed);
        }

        h1, h2, h3 {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header>
        <h1 class="text-center fade-in">Welcome to Blue Flame</h1>
    </header>
    <main>
        <section class="mt-1">
            <h2 class="text-center">Our Mission</h2>
            <p>To provide top-notch services with a focus on quality and customer satisfaction.</p>
        </section>
    </main>
    <footer>
        <p class="text-center mb-1">&copy; 2026 Blue Flame Inc.</p>
    </footer>
</body>
</html>
